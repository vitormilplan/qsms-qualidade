<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Demandas — Milplan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --navy-900:#0b1c33; --navy-800:#122c4f; --navy-700:#193a66;
  --red-600:#a83232; --gold-500:#e0a83e; --blue-400:#5b8fc9;
  --bg:#eef1f5; --card:#ffffff; --text-dark:#1b2430;
  --text-muted:#6b7480; --border:#e1e5eb; --green-ok:#2f8f5b;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text-dark);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.02em;
}
.app{max-width:1280px; margin:0 auto; padding:0 0 60px;}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
  border-bottom:4px solid var(--red-600);
  padding:22px 28px; display:flex; align-items:center; gap:16px;
}
.brand-mark{
  height:54px; display:flex; align-items:center; justify-content:center;
  background:#fff; border-radius:8px; padding:6px 12px;
}
.brand-mark img{height:100%; width:auto; object-fit:contain;}
.brand-text h1{color:#fff; font-size:24px; margin:0; font-weight:700;}
.brand-text .sub{color:#a9bcd6; font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-top:2px;}

/* CONTROLS */
.controls{
  background:var(--card); margin:20px 28px 0; border-radius:12px;
  border:1px solid var(--border); padding:16px 20px; display:flex; gap:10px; flex-wrap:wrap;
}
.tabbtn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
  padding:9px 16px; border-radius:8px; border:1.5px solid var(--border);
  background:#fff; color:var(--text-muted); cursor:pointer;
}
.tabbtn.active{background:var(--navy-800); color:#fff; border-color:var(--navy-800);}

/* SECTIONS & CARDS */
.section{margin:22px 28px 0;}
.section-title{
  font-size:20px; font-weight:700; color:var(--navy-900);
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
}
.section-title .bar{width:4px; height:18px; background:var(--red-600); border-radius:2px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:20px; box-shadow:0 1px 3px rgba(15,30,55,.04); margin-bottom:20px;
}

/* FORMULÁRIO GRID */
.form-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px;
}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700;}
.input-text, select{
  font-family:'Inter',sans-serif; font-size:13px; padding:9px 12px;
  border-radius:8px; border:1.5px solid var(--border); background:#fff; color:var(--text-dark); width:100%;
}
.btn-submit{
  background:var(--green-ok); color:#fff; border:none; padding:10px 20px;
  border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; margin-top:16px;
}
.btn-submit:hover{background:#257348;}
.btn-delete{
  background:#fdeceb; color:var(--red-600); border:1px solid #f0b8b0;
  padding:6px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;
}
.btn-add{
  background:var(--navy-800); color:#fff; border:none; padding:9px 12px;
  border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn-outline{
  background:#fff; color:var(--text-muted); border:1px solid var(--border);
  padding:6px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;
}
.btn-outline:hover{background:#f5f7fa;}

/* CONFIG LISTS */
.config-list{
  list-style:none; padding:0; margin:16px 0 0 0;
}
.config-list li{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 12px; border-bottom:1px solid #f0f2f5; font-size:13px;
}
.config-list li:hover{background:#fafbfc;}

/* TABELA */
.data-table{width:100%; border-collapse:collapse; font-size:13px;}
.data-table th{
  background:var(--navy-800); color:#fff; text-align:left; padding:9px 12px; font-weight:700; font-size:11.5px;
}
.data-table td{padding:9px 12px; border-bottom:1px solid #f0f2f5; vertical-align:middle;}
.data-table tr:hover td{background:#fafbfc;}
.badge-pendente{
  background:#fff8ea; color:#c78a1e; border:1px solid #f0d99a; 
  padding:3px 6px; border-radius:4px; font-size:11px; font-weight:700;
}

/* GRÁFICOS */
.charts-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(400px, 1fr)); gap:20px;
}
.chart-container{
  background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px;
  position:relative; height:300px;
}
.chart-container.full-width{
  grid-column: 1 / -1; height:350px;
}
.chart-title{font-size:14px; font-weight:700; color:var(--navy-900); text-align:center; margin-bottom:10px;}

/* MODAL FINALIZAR */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(10,18,36,.55);
  z-index:1000; align-items:center; justify-content:center; padding:20px;
}
.modal-box{
  background:#fff; border-radius:14px; max-width:400px; width:100%;
  padding:26px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35);
}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Modal para Finalizar/Editar Demanda -->
<div id="modalFinalizar" class="modal-overlay">
  <div class="modal-box">
    <h3 style="margin-top:0; color:var(--navy-800); font-size:18px; margin-bottom:16px;">Finalizar Demanda</h3>
    <form id="formFinalizar">
      <div class="field" style="margin-bottom:12px;">
        <label>Responsável pela Resposta</label>
        <select id="modResponsavel" required></select>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Data de Finalização</label>
        <input type="date" id="modDataFim" class="input-text" required>
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label>Tempo Despendido (h)</label>
        <input type="number" id="modTempo" class="input-text" min="0" step="0.5" required>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button type="button" class="btn-outline" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn-submit" style="margin:0;">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script>
// ---------- ESTADO DA APLICAÇÃO ----------
let STATE = { 
  demandas: [],
  tipos: [],
  setoresSolicitantes: [],
  setoresResponsaveis: [],
  responsaveis: []
};
let currentTab = 'registro';
let demandaEditando = null;

// Instâncias dos gráficos
let charts = {};

function loadState() {
  const saved = localStorage.getItem('milplan_demandas_v3');
  if (saved) {
    STATE = JSON.parse(saved);
  } else {
    // Dados de exemplo
    STATE.demandas = [
      { id: '1', codigo: 'REQ-001', nome: 'Análise de soldagem TIG', tipo: 'Análise de Documentação', setorSolicitante: 'Engenharia', setorResponsavel: 'Qualidade', responsavel: 'Vitor Hugo', dataChegada: '2026-08-01', dataFim: '2026-08-02', tempoGasto: 4 },
      { id: '2', codigo: 'REQ-002', nome: 'Levantamento de escopo PPP', tipo: 'PPPs', setorSolicitante: 'RH', setorResponsavel: 'Segurança', responsavel: '', dataChegada: '2026-09-02', dataFim: '', tempoGasto: null }
    ];
    STATE.tipos = ['Análise de Documentação', 'PPPs', 'Orçamentos', 'Auditoria'];
    STATE.setoresSolicitantes = ['Engenharia', 'RH', 'Manutenção', 'Suprimentos'];
    STATE.setoresResponsaveis = ['Qualidade', 'Segurança', 'Meio Ambiente'];
    STATE.responsaveis = ['Vitor Hugo', 'Carlos', 'Ana'];
    saveState();
  }
}

function saveState() {
  localStorage.setItem('milplan_demandas_v3', JSON.stringify(STATE));
}

const contentEl = document.getElementById('content');

function render() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  document.querySelectorAll('.tabbtn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === currentTab);
  });

  if (currentTab === 'registro') renderRegistroTab();
  else if (currentTab === 'dashboard') renderDashboardTab();
  else if (currentTab === 'config') renderConfigTab();
}

// ---------- ABA 1: REGISTRO ----------
function renderRegistroTab() {
  const getOptions = (arr) => arr.map(i => `<option value="${i}">${i}</option>`).join('');

  contentEl.innerHTML = `
    <div class="section">
      <div class="section-title"><span class="bar"></span>Nova Demanda</div>
      <div class="card">
        <form id="demandaForm">
          <div class="form-grid">
            <div class="field"><label>Código</label><input type="text" id="inpCodigo" class="input-text" placeholder="Ex: REQ-045" required></div>
            <div class="field"><label>Descrição</label><input type="text" id="inpNome" class="input-text" placeholder="O que foi solicitado..." required></div>
            <div class="field"><label>Tipo de Demanda</label><select id="inpTipo" required><option value="">Selecione...</option>${getOptions(STATE.tipos)}</select></div>
            <div class="field"><label>Setor Solicitante</label><select id="inpSetorSolicitante" required><option value="">Selecione...</option>${getOptions(STATE.setoresSolicitantes)}</select></div>
            <div class="field"><label>Setor Responsável</label><select id="inpSetorResponsavel" required><option value="">Selecione...</option>${getOptions(STATE.setoresResponsaveis)}</select></div>
            <div class="field"><label>Data de Chegada</label><input type="date" id="inpDataChegada" class="input-text" required></div>
            
            <!-- Removidos: Responsável, Data de Fim e Tempo (Ficam opcionais na criação ou preenchidos pelo botão Finalizar) -->
          </div>
          <button type="submit" class="btn-submit">Cadastrar Demanda</button>
        </form>
      </div>

      <div class="section-title"><span class="bar"></span>Demandas Registradas</div>
      <div class="card" style="overflow-x:auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Código</th><th>Nome</th><th>Tipo</th><th>Solicitante</th><th>Setor Resp.</th>
              <th>Pessoa Resp.</th><th>Chegada</th><th>Finalização</th><th>Tempo (h)</th><th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${STATE.demandas.length === 0 ? '<tr><td colspan="10" style="text-align:center; color:var(--text-muted);">Nenhuma demanda.</td></tr>' : ''}
            ${STATE.demandas.slice().reverse().map(d => {
              const isPendente = !d.dataFim || d.tempoGasto === null || d.tempoGasto === "";
              return `
              <tr>
                <td><b>${d.codigo}</b></td>
                <td>${d.nome}</td>
                <td>${d.tipo}</td>
                <td>${d.setorSolicitante}</td>
                <td>${d.setorResponsavel}</td>
                <td>${d.responsavel ? d.responsavel : '<span class="badge-pendente">PENDENTE</span>'}</td>
                <td>${formatDate(d.dataChegada)}</td>
                <td>${!isPendente ? formatDate(d.dataFim) : '-'}</td>
                <td>${!isPendente ? d.tempoGasto + 'h' : '-'}</td>
                <td>
                  <div style="display:flex; gap:6px;">
                    ${isPendente 
                      ? `<button class="btn-submit" style="margin:0; padding:6px 10px; font-size:11.5px;" onclick="abrirModal('${d.id}')">Finalizar</button>` 
                      : `<button class="btn-outline" style="margin:0; padding:6px 10px; font-size:11.5px;" onclick="abrirModal('${d.id}')">Editar</button>`}
                    <button class="btn-delete" onclick="deleteDemanda('${d.id}')">Excluir</button>
                  </div>
                </td>
              </tr>
            `}).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('demandaForm').onsubmit = function(e) {
    e.preventDefault();
    const novaDemanda = {
      id: Math.random().toString(36).substr(2, 9),
      codigo: document.getElementById('inpCodigo').value.trim(),
      nome: document.getElementById('inpNome').value.trim(),
      tipo: document.getElementById('inpTipo').value,
      setorSolicitante: document.getElementById('inpSetorSolicitante').value,
      setorResponsavel: document.getElementById('inpSetorResponsavel').value,
      dataChegada: document.getElementById('inpDataChegada').value,
      responsavel: "", // Fica vazio até finalizar
      dataFim: "",     // Fica vazio até finalizar
      tempoGasto: null // Fica nulo até finalizar
    };
    STATE.demandas.push(novaDemanda);
    saveState();
    render();
  };
}

// Modal Logic
window.abrirModal = function(id) {
  demandaEditando = STATE.demandas.find(d => d.id === id);
  if(!demandaEditando) return;
  
  const selectResp = document.getElementById('modResponsavel');
  selectResp.innerHTML = '<option value="">Selecione...</option>' + STATE.responsaveis.map(i => `<option value="${i}">${i}</option>`).join('');
  
  selectResp.value = demandaEditando.responsavel || '';
  document.getElementById('modDataFim').value = demandaEditando.dataFim || '';
  document.getElementById('modTempo').value = demandaEditando.tempoGasto !== null ? demandaEditando.tempoGasto : '';
  
  document.getElementById('modalFinalizar').style.display = 'flex';
}

window.fecharModal = function() {
  document.getElementById('modalFinalizar').style.display = 'none';
  demandaEditando = null;
}

document.getElementById('formFinalizar').onsubmit = function(e) {
  e.preventDefault();
  if(!demandaEditando) return;
  
  demandaEditando.responsavel = document.getElementById('modResponsavel').value;
  demandaEditando.dataFim = document.getElementById('modDataFim').value;
  demandaEditando.tempoGasto = parseFloat(document.getElementById('modTempo').value);
  
  saveState();
  fecharModal();
  render();
}

window.deleteDemanda = function(id) {
  if(confirm('Excluir esta demanda?')) {
    STATE.demandas = STATE.demandas.filter(d => d.id !== id);
    saveState();
    render();
  }
};

function formatDate(dateString) {
  if(!dateString) return '-';
  const parts = dateString.split('-');
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function initCharts() {
  const d = STATE.demandas;
  const colors = ['#193a66', '#a83232', '#e0a83e', '#5b8fc9', '#2f8f5b', '#6b7480'];

  const countSolicitante = {};
  const countResponsavel = {};
  const countMensal = {};
  const tempoTipo = {};
  const tempoResp = {};

  d.forEach(x => { 
    countSolicitante[x.setorSolicitante] = (countSolicitante[x.setorSolicitante] || 0) + 1; 
    countResponsavel[x.setorResponsavel] = (countResponsavel[x.setorResponsavel] || 0) + 1; 
    
    if(x.dataChegada) {
      const mesAno = x.dataChegada.substring(0, 7);
      countMensal[mesAno] = (countMensal[mesAno] || 0) + 1;
    }

    // Só calcula tempo nas demandas que já foram FINALIZADAS
    if(x.tempoGasto !== null && !isNaN(x.tempoGasto)) {
      if(!tempoTipo[x.tipo]) tempoTipo[x.tipo] = { sum: 0, count: 0 };
      tempoTipo[x.tipo].sum += x.tempoGasto;
      tempoTipo[x.tipo].count += 1;

      tempoResp[x.setorResponsavel] = (tempoResp[x.setorResponsavel] || 0) + x.tempoGasto;
    }
  });

  const avgTempoTipo = {};
  Object.keys(tempoTipo).forEach(k => { avgTempoTipo[k] = (tempoTipo[k].sum / tempoTipo[k].count).toFixed(1); });

  const mesesOrdenados = Object.keys(countMensal).sort();
  const valoresMensais = mesesOrdenados.map(m => countMensal[m]);
  const labelsMensais = mesesOrdenados.map(m => m.split('-')[1] + '/' + m.split('-')[0]);

  charts.c0 = new Chart(document.getElementById('chartEvolucao'), {
    type: 'line',
    data: { labels: labelsMensais, datasets: [{ label: 'Qtd de Demandas', data: valoresMensais, borderColor: colors[1], backgroundColor: colors[1]+'40', borderWidth:3, fill:true, tension:0.3 }] },
    options: { maintainAspectRatio: false, plugins: { legend: {display:false} }, scales: { y: { beginAtZero: true } } }
  });
  charts.c1 = new Chart(document.getElementById('chartSolicitante'), {
    type: 'bar',
    data: { labels: Object.keys(countSolicitante), datasets: [{ data: Object.values(countSolicitante), backgroundColor: colors[0] }] },
    options: { maintainAspectRatio: false, plugins: { legend: {display:false} } }
  });
  charts.c2 = new Chart(document.getElementById('chartResponsavel'), {
    type: 'bar',
    data: { labels: Object.keys(countResponsavel), datasets: [{ data: Object.values(countResponsavel), backgroundColor: colors[1] }] },
    options: { maintainAspectRatio: false, plugins: { legend: {display:false} } }
  });
  charts.c3 = new Chart(document.getElementById('chartTempoMedio'), {
    type: 'bar',
    data: { labels: Object.keys(avgTempoTipo), datasets: [{ data: Object.values(avgTempoTipo), backgroundColor: colors[2] }] },
    options: { maintainAspectRatio: false, plugins: { legend: {display:false} } }
  });
  charts.c4 = new Chart(document.getElementById('chartTempoTotal'), {
    type: 'doughnut',
    data: { labels: Object.keys(tempoResp), datasets: [{ data: Object.values(tempoResp), backgroundColor: colors }] },
    options: { maintainAspectRatio: false }
  });
}

window.addConfig = function(arrayName, inputId) {
  const val = document.getElementById(inputId).value.trim();
  if(val && !STATE[arrayName].includes(val)) { STATE[arrayName].push(val); saveState(); render(); }
}
window.removeConfig = function(arrayName, index) {
  if(confirm('Remover esta opção?')) { STATE[arrayName].splice(index, 1); saveState(); render(); }
}
